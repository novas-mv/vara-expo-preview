<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VARA — C variations</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#001D61; --cream:#F3EDDF; --ink:#F6F1E6; --coral:#FF8A66;
  --gut:clamp(20px,4.6vw,72px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#00133F;color:var(--ink);font-family:"General Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.d{font-family:"Cabinet Grotesk",sans-serif;font-weight:800;letter-spacing:-.04em;line-height:.88}

.note{position:sticky;top:0;z-index:70;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
  padding:12px var(--gut);background:rgba(0,10,32,.95);border-bottom:1px solid rgba(246,241,230,.13);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.note b{color:var(--ink);font-weight:600}
.note span{color:rgba(246,241,230,.52);text-transform:none;letter-spacing:0;font-size:13px}

.stage{position:relative;min-height:100vh;min-height:100lvh;overflow:hidden;isolation:isolate;
  padding:clamp(70px,9vh,104px) var(--gut) clamp(30px,5vh,58px);display:grid;
  background:
    radial-gradient(38% 30% at 14% 26%, rgba(107,254,150,.20), transparent 70%),
    radial-gradient(34% 28% at 86% 22%, rgba(182,108,241,.20), transparent 72%),
    radial-gradient(40% 32% at 70% 78%, rgba(31,225,254,.15), transparent 74%),
    radial-gradient(30% 26% at 24% 84%, rgba(255,138,102,.16), transparent 74%),
    linear-gradient(180deg,#001A52 0%,#002273 44%,#001347 100%);
}
.el{position:absolute;display:block;z-index:0;opacity:.96;
  filter:drop-shadow(0 30px 70px rgba(0,0,0,.45))}

/* the wordmark title — set once, used by all four */
.title{font-family:"Cabinet Grotesk";font-weight:800;letter-spacing:-.02em;line-height:1;
  font-size:clamp(15px,1.5vw,21px)}
.title i{font-style:normal;color:var(--coral)}

/* type over the element gets glyph-local shadows only — never a pool, which
   would sit over the logo and dim it */
.lit{text-shadow:0 1px 3px rgba(0,10,34,.9),0 0 16px rgba(0,10,34,.8),0 0 40px rgba(0,10,34,.55)}

.cta{display:flex;gap:11px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;text-decoration:none;padding:13px 22px;border-radius:999px;
  font-weight:600;font-size:14px;background:var(--cream);color:#04101F}
.pill.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(246,241,230,.55)}

/* countdown, stripped: no unit words, just a mono figure and one label */
.cd{display:flex;align-items:baseline;gap:10px;font-family:"JetBrains Mono",monospace;
  font-weight:700;font-variant-numeric:tabular-nums}
.cd .n{font-size:clamp(15px,1.5vw,20px);color:rgba(246,241,230,.94)}
.cd .t{font-size:11px;color:rgba(246,241,230,.58);font-family:"General Sans";letter-spacing:.04em}

/* ===== C1 — date + place stacked, one lockup, everything else to the edges ===== */
#c1{place-items:center;text-align:center}
#c1 .el{top:50%;left:50%;transform:translate(-50%,-54%);width:min(62vw,640px)}
#c1 .lock{position:relative;z-index:1;display:grid;justify-items:center;gap:clamp(4px,.8vh,12px)}
#c1 .day{font-size:clamp(40px,7.4vw,116px)}
#c1 .place{font-size:clamp(26px,4.6vw,72px);color:var(--cream)}
#c1 .sub{font-size:clamp(13px,1.15vw,16px);color:rgba(246,241,230,.8);margin-top:10px}
#c1 .tl{position:absolute;top:clamp(70px,9vh,104px);left:var(--gut);z-index:2}
#c1 .bl{position:absolute;left:var(--gut);bottom:clamp(30px,5vh,58px);z-index:2}
#c1 .br{position:absolute;right:var(--gut);bottom:clamp(30px,5vh,58px);z-index:2;text-align:right}

/* ===== C2 — the place IS the headline ===== */
#c2{place-items:center;text-align:center}
#c2 .el{top:50%;left:50%;transform:translate(-50%,-50%);width:min(58vw,600px)}
#c2 .lock{position:relative;z-index:1;display:grid;justify-items:center;gap:clamp(6px,1.1vh,16px)}
#c2 .day{font-size:clamp(20px,2.4vw,34px);color:var(--cream);letter-spacing:.01em}
#c2 .place{font-size:clamp(44px,8.6vw,132px);line-height:.86}
#c2 .place em{font-style:normal;display:block;color:var(--coral);font-size:.52em;margin-top:.12em}
#c2 .tl{position:absolute;top:clamp(70px,9vh,104px);left:var(--gut);z-index:2}
#c2 .bb{position:absolute;left:0;right:0;bottom:clamp(30px,5vh,58px);z-index:2;
  display:flex;justify-content:center;align-items:center;gap:clamp(16px,3vw,40px);flex-wrap:wrap}

/* ===== C3 — corners hold utility, centre holds the statement ===== */
#c3{align-content:center}
#c3 .el{top:50%;left:50%;transform:translate(-50%,-52%);width:min(60vw,620px)}
#c3 .lock{position:relative;z-index:1;text-align:center;display:grid;justify-items:center;gap:6px}
#c3 .day{font-size:clamp(34px,6vw,94px)}
#c3 .place{font-size:clamp(30px,5.4vw,84px);color:var(--cream)}
#c3 .tl{position:absolute;top:clamp(70px,9vh,104px);left:var(--gut);z-index:2}
#c3 .tr{position:absolute;top:clamp(70px,9vh,104px);right:var(--gut);z-index:2;text-align:right;
  font-size:clamp(12px,1.05vw,15px);color:rgba(246,241,230,.8);line-height:1.5}
#c3 .bl{position:absolute;left:var(--gut);bottom:clamp(30px,5vh,58px);z-index:2}
#c3 .br{position:absolute;right:var(--gut);bottom:clamp(30px,5vh,58px);z-index:2}

/* ===== C4 — element between the date and the place ===== */
#c4{place-items:center;text-align:center}
#c4 .el{top:50%;left:50%;transform:translate(-50%,-50%);width:min(52vw,540px)}
#c4 .over{position:relative;z-index:1;display:grid;justify-items:center;
  height:min(74vh,720px);align-content:space-between}
#c4 .day{font-size:clamp(34px,6.2vw,96px)}
#c4 .place{font-size:clamp(30px,5.4vw,84px);color:var(--cream)}
#c4 .sub{font-size:clamp(13px,1.1vw,15.5px);color:rgba(246,241,230,.8);margin-top:8px}
#c4 .tl{position:absolute;top:clamp(70px,9vh,104px);left:var(--gut);z-index:2}
#c4 .bb{position:absolute;left:0;right:0;bottom:clamp(30px,5vh,58px);z-index:2;
  display:flex;justify-content:center;align-items:center;gap:clamp(16px,3vw,40px);flex-wrap:wrap}

/* ---- added by tools/build-hero-variants.py ----------------------------
   One variant per document, so the board's tabs are real panels and not
   scroll anchors. The caption overlays rather than stacks: it labelled each
   stage as you scrolled the deck, and its height was the only thing making a
   single-stage page scrollable. Everything above this line is the variant's
   own CSS, untouched. */
html,body{overscroll-behavior:none}
body > .note{position:fixed;top:0;left:0;right:0}
</style>
</head>
<body>
<div class="note"><b>C1 · One lockup</b> <span>Date and place stacked as a single centred lockup over the element. Title, CTAs and countdown pushed to the corners.</span></div>
<section class="stage" id="c1">
  <div class="tl title">VARA EXPO <i>2026</i></div>
  <img class="el" src="./element.png" alt="">
  <div class="lock">
    <div class="d day lit">6&ndash;8 November</div>
    <div class="d place lit">Central Park</div>
    <div class="sub lit">Hulhumalé, Maldives &nbsp;·&nbsp; Free entry</div>
  </div>
  <div class="bl cta"><a class="pill" href="#">Register Now</a><a class="pill ghost" href="#">Exhibit with us</a></div>
  <div class="br cd"><span class="n" data-cd>--</span><span class="t">days to go</span></div>
</section>

<!-- C2 -->

<script>
(function(){
  var T=Date.UTC(2026,10,6,4,0,0);
  function tick(){
    var d=Math.max(0,Math.floor((T-Date.now())/864e5));
    document.querySelectorAll('[data-cd]').forEach(function(e){
      if(e.textContent!==String(d)) e.textContent=d;
    });
  }
  tick(); var iv=setInterval(tick,60000);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){clearInterval(iv);iv=null} else if(!iv){tick();iv=setInterval(tick,60000)}
  },{passive:true});
})();
</script>
</body></html>
